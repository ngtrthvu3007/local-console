services:
  floci:
    image: floci/floci:2.4.0
    ports:
      - "4566:4566"
      - "6379-6399:6379-6399" # Redis của ElastiCache, cho BE chạy ngoài Docker
    environment:
      FLOCI_SERVICES_UI_ENABLED: "false" # tắt UI có sẵn của Floci
      FLOCI_STORAGE_MODE: hybrid # giữ dữ liệu khi tắt/bật
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock # để Floci bật container Redis/RabbitMQ/Lambda
      - floci-data:/app/data

  console:
    build: .
    ports:
      - "3701:3701"
    environment:
      AWS_ENDPOINT_URL: http://floci:4566
      FLOCI_PUBLIC_URL: http://localhost:4566
      AWS_REGION: ${AWS_REGION:-ap-southeast-1} # phải trùng region của app
    extra_hosts:
      - "host.docker.internal:host-gateway" # Linux
    depends_on:
      - floci

volumes:
  floci-data: # xóa dữ liệu: docker compose down -v
